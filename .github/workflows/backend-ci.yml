name: Backend CI

# Build + testes automáticos. Falha de build ou de teste reprova o check
# e, com a proteção das branches dev/main ativa, bloqueia o merge.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (Java 17)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Garantir permissão de execução do wrapper
        run: chmod +x ./mvnw

      - name: Compilar
        run: ./mvnw -B -ntp clean compile

      - name: Build + testes (verify)
        run: ./mvnw -B -ntp verify

      - name: Publicar relatórios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/*.xml"
          if-no-files-found: ignore
