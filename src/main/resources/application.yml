# ==========================================================================
# Configuração base da API do Nexo.
#
# Regras do projeto:
#  - Nenhum segredo fica neste arquivo. Tudo que é sensível/variável entra
#    por variável de ambiente (${VAR:default}); os defaults servem apenas
#    para o ambiente local de desenvolvimento.
#  - Config específica de ambiente fica nos blocos de perfil abaixo
#    (dev / test), nunca no código Java.
# ==========================================================================
spring:
  application:
    name: nexo-api

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # o schema é controlado pelo Flyway
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    # db/seed só entra em dev e test (ver os perfis abaixo): é lá que ficam os
    # dados de conveniência, como a senha conhecida do administrador inicial.
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

# ---- Actuator: expõe apenas health e info ----
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Estrutura base da API do projeto Nexo
    java: "17"

app:
  # ---- Autenticação JWT ----
  # O secret fica sem default aqui de propósito: fora de dev/test a aplicação
  # só sobe com JWT_SECRET definido no ambiente.
  jwt:
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:nexo-api}
    expiration: ${JWT_EXPIRATION:PT2H}

  # ---- CORS para o frontend (origens separadas por vírgula) ----
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
    allowed-headers: ${CORS_ALLOWED_HEADERS:*}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}
    max-age: 3600

  # ---- Vimeo: só o oEmbed público, que não exige chave ----
  vimeo:
    oembed-url: ${VIMEO_OEMBED_URL:https://vimeo.com/api/oembed.json}
    timeout: ${VIMEO_TIMEOUT:PT5S}

  # ---- Assistente de IA (Google Gemini) ----
  # Sem IA_API_KEY a aplicação sobe normalmente; só as rotas de IA respondem 503.
  ia:
    provedor: ${IA_PROVEDOR:gemini}             # gemini | fake
    api-key: ${IA_API_KEY:}
    url-base: ${IA_URL_BASE:https://generativelanguage.googleapis.com/v1beta}
    modelo: ${IA_MODELO:gemini-2.5-flash}
    modelo-embedding: ${IA_MODELO_EMBEDDING:gemini-embedding-001}
    dimensoes: 768                              # fixo: é o tamanho da coluna vector(768) da V14
    timeout: ${IA_TIMEOUT:PT20S}
    max-tentativas: ${IA_MAX_TENTATIVAS:3}
    indexacao:
      tamanho-trecho: ${IA_TAMANHO_TRECHO:1000}
      sobreposicao: ${IA_SOBREPOSICAO_TRECHO:200}
      max-tentativas: ${IA_INDEXACAO_MAX_TENTATIVAS:5}
      intervalo-nova-tentativa: ${IA_INDEXACAO_INTERVALO:PT5M}
    busca:
      trechos: ${IA_BUSCA_TRECHOS:5}
      distancia-maxima: ${IA_BUSCA_DISTANCIA_MAXIMA:0.6}
    consulta:
      perguntas-por-minuto: ${IA_PERGUNTAS_POR_MINUTO:10}
      mensagens-historico: ${IA_MENSAGENS_HISTORICO:6}

logging:
  level:
    root: INFO

# ==========================================================================
# Perfil: dev  ->  PostgreSQL local (docker-compose)
# ==========================================================================
---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nexo}
    username: ${DB_USERNAME:nexo}
    password: ${DB_PASSWORD:nexo}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
  flyway:
    locations: classpath:db/migration,classpath:db/seed
  jpa:
    show-sql: true

# Chave de desenvolvimento: não é segredo e não vale em outros ambientes.
app:
  # Em dev, qualquer porta local serve (o Vite troca de porta se a 5173 estiver em uso).
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  jwt:
    secret: ${JWT_SECRET:nexo-chave-de-desenvolvimento-local-nao-use-em-producao}

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.flywaydb: INFO

# ==========================================================================
# Perfil: test  ->  PostgreSQL efêmero via Testcontainers (requer Docker)
# A URL jdbc:tc:... sobe/derruba o container automaticamente durante os testes.
# ==========================================================================
---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    # Imagem com pgvector (pgvector/pgvector:pg16): a V14 cria a extensão vector.
    url: jdbc:tc:pgvector:pg16:///nexo_test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  flyway:
    locations: classpath:db/migration,classpath:db/seed
  jpa:
    show-sql: false

app:
  jwt:
    secret: nexo-chave-de-teste-automatizado-nao-use-em-producao
  # Os testes nunca chamam o provedor real: o ClienteIaFake gera embeddings e respostas determinísticos.
  ia:
    provedor: fake

logging:
  level:
    org.flywaydb: INFO
