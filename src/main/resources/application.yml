# ==========================================================================
# Configuração base da API do Nexo.
#
# Regras do projeto:
#  - Nenhum segredo fica neste arquivo. Tudo que é sensível/variável entra
#    por variável de ambiente (${VAR:default}); os defaults servem apenas
#    para o ambiente local de desenvolvimento.
#  - Config específica de ambiente fica nos blocos de perfil abaixo
#    (dev / test), nunca no código Java.
# ==========================================================================
spring:
  application:
    name: nexo-api

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # o schema é controlado pelo Flyway
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

# ---- Actuator: expõe apenas health e info ----
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Estrutura base da API do projeto Nexo
    java: "21"

# ---- CORS para o frontend (origens separadas por vírgula) ----
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
    allowed-headers: ${CORS_ALLOWED_HEADERS:*}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}
    max-age: 3600

logging:
  level:
    root: INFO

# ==========================================================================
# Perfil: dev  ->  PostgreSQL local (docker-compose)
# ==========================================================================
---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nexo}
    username: ${DB_USERNAME:nexo}
    password: ${DB_PASSWORD:nexo}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
  jpa:
    show-sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.flywaydb: INFO

# ==========================================================================
# Perfil: test  ->  PostgreSQL efêmero via Testcontainers (requer Docker)
# A URL jdbc:tc:... sobe/derruba o container automaticamente durante os testes.
# ==========================================================================
---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:tc:postgresql:16:///nexo_test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    show-sql: false

logging:
  level:
    org.flywaydb: INFO
