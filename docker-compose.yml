# Banco de dados local para o perfil "dev".
# Variáveis são lidas de um arquivo .env (não versionado); há defaults
# para funcionar sem configuração nenhuma:  docker compose up -d
name: nexo

services:
  db:
    image: postgres:16-alpine
    container_name: nexo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-nexo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nexo}
      POSTGRES_DB: ${DB_NAME:-nexo}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - nexo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-nexo} -d ${DB_NAME:-nexo}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  nexo-db-data:
    name: nexo-db-data
